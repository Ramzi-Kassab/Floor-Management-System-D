{% extends "base.html" %}

{% block title %}BOM Layout Unavailable - ARDT FMS{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto mt-16">
    <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-8 text-center">
        <div class="mb-6">
            <div class="w-16 h-16 mx-auto bg-amber-100 dark:bg-amber-900 rounded-full flex items-center justify-center">
                <i data-lucide="file-question" class="w-8 h-8 text-amber-600 dark:text-amber-400"></i>
            </div>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Layout Data Unavailable</h1>
        <p class="text-gray-600 dark:text-gray-400 mb-6">
            {{ message }}
        </p>
        <div class="text-sm text-gray-500 dark:text-gray-500 mb-8">
            <p><strong>BOM:</strong> {{ bom.code }}</p>
            <p><strong>Design:</strong> {{ bom.design.mat_no|default:"N/A" }}</p>
        </div>
        <div class="flex justify-center gap-4">
            <a href="{% url 'technology:bom_detail' bom.pk %}"
               class="inline-flex items-center px-4 py-2 bg-gray-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 rounded-lg hover:bg-gray-200">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i>Back to BOM
            </a>
            <a href="{% url 'cutter_map:index' %}?from=bom_create&design_id={{ bom.design.pk }}&design_mat={{ bom.design.mat_no }}"
               class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                <i data-lucide="upload" class="w-4 h-4 mr-2"></i>Upload New PDF
            </a>
        </div>
    </div>
</div>
{% endblock %}
